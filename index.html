<!DOCTYPE html>
<html lang="th">
<head>
  <meta charset="UTF-8">

  <meta name="viewport"
        content="width=device-width,
                 initial-scale=1.0,
                 maximum-scale=1.0,
                 user-scalable=no">

  <title>AR Hiro - Flying Bird</title>

  <!-- A-Frame -->
  <script src="https://aframe.io/releases/1.5.0/aframe.min.js"></script>

  <!-- AR.js -->
  <script src="https://raw.githack.com/AR-js-org/AR.js/master/aframe/build/aframe-ar.js"></script>

  <style>
    html, body {
      margin: 0;
      padding: 0;
      width: 100%;
      height: 100%;
      overflow: hidden;
      background: #000;
    }

    #info {
      position: fixed;
      top: 15px;
      left: 50%;
      transform: translateX(-50%);
      z-index: 10;

      color: white;
      background: rgba(0,0,0,0.6);
      padding: 10px 18px;
      border-radius: 20px;

      font-family: Arial, sans-serif;
      font-size: 15px;
      text-align: center;
      pointer-events: none;
    }
  </style>
</head>

<body>

  <div id="info">
    📷 ส่องกล้องไปที่ Hiro Marker
  </div>

  <a-scene
    embedded
    vr-mode-ui="enabled: false"
    renderer="antialias: true; alpha: true"
    arjs="sourceType: webcam; debugUIEnabled: false;"
  >

    <!-- Hiro Marker -->
    <a-marker
      preset="hiro"
      id="hiroMarker"
      emitevents="true"
      smooth="true"
      smoothCount="10"
      smoothTolerance="0.01"
      smoothThreshold="5"
    >

      <!-- กลุ่มนก -->
      <a-entity
        id="bird"
        position="0 0.8 0"
        scale="0.35 0.35 0.35"
      >

        <!-- ตัวนก -->
        <a-sphere
          position="0 0 0"
          radius="0.45"
          color="#3498db"
        ></a-sphere>

        <!-- หัว -->
        <a-sphere
          position="0 0.35 -0.05"
          radius="0.32"
          color="#2980b9"
        ></a-sphere>

        <!-- จะงอยปาก -->
        <a-cone
          position="0 0.35 -0.38"
          rotation="90 0 0"
          radius-bottom="0.15"
          radius-top="0"
          height="0.35"
          color="#f1c40f"
        ></a-cone>

        <!-- ตาซ้าย -->
        <a-sphere
          position="-0.15 0.45 -0.25"
          radius="0.055"
          color="#000"
        ></a-sphere>

        <!-- ตาขวา -->
        <a-sphere
          position="0.15 0.45 -0.25"
          radius="0.055"
          color="#000"
        ></a-sphere>

        <!-- ปีกซ้าย -->
        <a-entity
          id="leftWing"
          position="-0.38 0.05 0"
          rotation="0 0 -20"
        >
          <a-box
            position="-0.35 0 0"
            width="0.7"
            height="0.12"
            depth="0.3"
            color="#f1c40f"
          ></a-box>
        </a-entity>

        <!-- ปีกขวา -->
        <a-entity
          id="rightWing"
          position="0.38 0.05 0"
          rotation="0 0 20"
        >
          <a-box
            position="0.35 0 0"
            width="0.7"
            height="0.12"
            depth="0.3"
            color="#f1c40f"
          ></a-box>
        </a-entity>

        <!-- หาง -->
        <a-cone
          position="0 0 -0.5"
          rotation="-90 0 0"
          radius-bottom="0.3"
          radius-top="0"
          height="0.5"
          color="#1abc9c"
        ></a-cone>

      </a-entity>

    </a-marker>

    <!-- กล้อง AR -->
    <a-entity camera></a-entity>

  </a-scene>


  <script>

    const marker = document.querySelector("#hiroMarker");
    const bird = document.querySelector("#bird");

    const leftWing = document.querySelector("#leftWing");
    const rightWing = document.querySelector("#rightWing");

    /*
     * ตรวจว่าพบ Hiro Marker
     */
    marker.addEventListener("markerFound", function () {

      console.log("Hiro Marker Found!");

      document.querySelector("#info").innerHTML =
        "🐦 พบ Marker แล้ว! นกกำลังบิน";

      bird.setAttribute(
        "animation__fly",
        {
          property: "position",
          from: "-2 1 0",
          to: "2 1.8 0",
          dur: 2500,
          easing: "easeInOutSine",
          loop: true,
          dir: "alternate"
        }
      );

      /*
       * กระพือปีก
       */
      leftWing.setAttribute(
        "animation__wing",
        {
          property: "rotation",
          from: "0 0 -20",
          to: "0 0 -65",
          dur: 250,
          easing: "easeInOutSine",
          loop: true,
          dir: "alternate"
        }
      );

      rightWing.setAttribute(
        "animation__wing",
        {
          property: "rotation",
          from: "0 0 20",
          to: "0 0 65",
          dur: 250,
          easing: "easeInOutSine",
          loop: true,
          dir: "alternate"
        }
      );

    });


    /*
     * เมื่อไม่พบ Marker
     */
    marker.addEventListener("markerLost", function () {

      console.log("Hiro Marker Lost");

      document.querySelector("#info").innerHTML =
        "📷 ส่องกล้องไปที่ Hiro Marker";

    });

  </script>

</body>
</html>
